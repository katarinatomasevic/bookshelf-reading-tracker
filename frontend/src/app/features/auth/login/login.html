<div class="auth-page">
  <form
    class="auth-card app-card"
    data-testid="login-form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <h1>Log in</h1>

    <div class="field">
      <label for="email">Email</label>
      <input
        pInputText
        id="email"
        type="email"
        data-testid="login-email"
        formControlName="email"
        autocomplete="email"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <p-password
        id="password"
        data-testid="login-password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="field-error">Password is required.</small>
      }
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" data-testid="login-error" />
    }

    <p-button
      type="submit"
      label="Log in"
      data-testid="login-submit"
      [loading]="submitting()"
      styleClass="w-full"
    />

    <p class="auth-switch">
      Don't have an account?
      <a routerLink="/register" [queryParams]="returnUrlQueryParams">Register</a>
    </p>
  </form>
</div>
