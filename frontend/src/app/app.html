<header class="app-header">
  <a routerLink="/" class="app-header__brand">Bookshelf</a>

  <nav class="app-header__nav" data-testid="nav">
    <!-- Home matches exactly: "/" is a prefix of every other route, so without this it would
         stay marked as the current page everywhere in the app. -->
    <a
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      data-testid="nav-home"
      >Home</a
    >

    @if (authService.isLoggedIn()) {
      <a routerLink="/shelf" routerLinkActive="is-active" data-testid="nav-shelf">My shelf</a>
      <a routerLink="/dashboard" routerLinkActive="is-active" data-testid="nav-dashboard"
        >Dashboard</a
      >

      <button
        type="button"
        class="app-header__profile"
        aria-haspopup="true"
        aria-label="Profile menu"
        data-testid="nav-profile-menu"
        (click)="profileMenu.toggle($event)"
      >
        <i class="pi pi-user"></i>
        <span class="app-header__user" data-testid="nav-display-name">{{
          authService.currentUser()?.displayName
        }}</span>
        <i class="pi pi-angle-down app-header__profile-caret"></i>
      </button>
      <p-menu #profileMenu [model]="profileMenuItems" [popup]="true" />
    } @else {
      <a routerLink="/login" routerLinkActive="is-active" data-testid="nav-login">Log in</a>
      <a routerLink="/register" routerLinkActive="is-active" data-testid="nav-register">Register</a>
    }
  </nav>
</header>

<router-outlet />

<app-session-expired-modal />
