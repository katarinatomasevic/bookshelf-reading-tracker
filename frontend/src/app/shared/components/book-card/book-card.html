<article class="app-card book-card" (click)="onSelect()" role="button" tabindex="0" (keydown.enter)="onSelect()">
  <div class="book-card__cover-wrapper">
    @if (coverUrl(); as url) {
      <img class="book-card__cover" [src]="url" [alt]="book().title" />
    } @else {
      <div class="book-card__cover book-card__cover--placeholder">
        <i class="pi pi-book"></i>
      </div>
    }

    @if (isOnShelf()) {
      <span class="book-card__badge"><i class="pi pi-check"></i> On shelf</span>
    }
  </div>

  <div class="book-card__body">
    <div class="book-card__title">{{ book().title }}</div>
    @if (book().author; as author) {
      <div class="book-card__author">{{ author }}</div>
    }

    @if (stars(); as stars) {
      <div class="book-card__rating" [attr.aria-label]="'Rated ' + rating() + ' out of 5'">
        @for (filled of stars; track $index) {
          <i class="pi" [class.pi-star-fill]="filled" [class.pi-star]="!filled"></i>
        }
      </div>
    }
  </div>

  @if (showAddButton()) {
    <!-- The card itself opens the details page, so the button must not bubble into it. -->
    <div class="book-card__actions" (click)="$event.stopPropagation()">
      <app-add-to-shelf-button
        [isOnShelf]="isOnShelf()"
        [pending]="addPending()"
        (add)="addToShelf.emit()"
      />
    </div>
  }
</article>
